<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskline – Todo Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1fa;--bg2:#e7e0f5;--panel:#ffffffcc;--line:#d9d0ee;--ink:#1d1530;--mute:#6f6588;
  --amethyst:#7a56f0;--coral:#ef5d4f;--mint:#12a77b;--amber:#d98a0b;--glow:#7a56f033;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f20;--bg2:#241838;--panel:#251c3acc;--line:#3a2d57;--ink:#f3eefb;--mute:#a395c4;
  --amethyst:#9b7cff;--coral:#ff7a6b;--mint:#4fe0b0;--amber:#ffc15e;--glow:#9b7cff40}}
:root[data-theme="dark"]{
  --bg:#150f20;--bg2:#241838;--panel:#251c3acc;--line:#3a2d57;--ink:#f3eefb;--mute:#a395c4;
  --amethyst:#9b7cff;--coral:#ff7a6b;--mint:#4fe0b0;--amber:#ffc15e;--glow:#9b7cff40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Sora,system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(60rem 40rem at 10% -10%,var(--bg2),transparent 60%),radial-gradient(40rem 30rem at 100% 100%,var(--glow),transparent 60%);
  background-attachment:fixed}
.app{max-width:1080px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px -30px var(--glow)}
.hero{padding:28px;position:sticky;top:20px}
@media(max-width:820px){.hero{position:static}}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;letter-spacing:-.01em}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px}
.ring{position:relative;width:230px;height:230px;margin:26px auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font-family:Fraunces,Georgia,serif;font-size:62px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ring .sub{color:var(--mute);font-size:13px;margin-top:6px}
.msg{text-align:center;color:var(--mute);font-size:14px;margin:0 0 20px;min-height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px}
.stat span{font-size:12px;color:var(--mute)}
.main{display:flex;flex-direction:column;gap:16px}
.add{padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px}
.add input,.add select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.add input:focus,.add select:focus,button:focus-visible{outline:2px solid var(--amethyst);outline-offset:2px}
.add .title{grid-column:1/-1;font-size:16px}
.add .opts{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/2}
.add select,.add input[type=date]{flex:1;min-width:110px;color-scheme:light dark}
.go{grid-column:2;border:0;border-radius:14px;padding:0 22px;font:inherit;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--amethyst),var(--coral));box-shadow:0 10px 24px -10px var(--amethyst)}
.go:active{transform:scale(.97)}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;border-radius:20px;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.98);opacity:0}}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.task[data-p=high]{--c:var(--coral)}.task[data-p=med]{--c:var(--amber)}.task[data-p=low]{--c:var(--mint)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;display:grid;place-content:center;color:#fff;font-size:15px;transition:background .2s}
.task.done .check{background:var(--c)}
.body{flex:1;min-width:0}
.t{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.meta{display:flex;gap:8px;margin-top:4px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.meta .late{color:var(--coral);font-weight:600}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:18px;width:34px;height:34px;border-radius:10px}
.del:hover{color:var(--coral)}
.empty{text-align:center;color:var(--mute);padding:40px 20px;border:1px dashed var(--line);border-radius:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="card hero">
    <div class="top"><div class="brand">Taskline</div><button class="icon-btn" id="theme" aria-label="Toggle theme">◐</button></div>
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7cff"/><stop offset=".6" stop-color="#ff7a6b"/><stop offset="1" stop-color="#ffc15e"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="86" fill="none" stroke-width="16"/>
        <circle class="bar" id="bar" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
      </svg>
      <div class="num"><div class="pct" id="pct">0%</div><div class="sub" id="sub">of tasks done</div></div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="stats">
      <div class="stat"><b id="sOpen">0</b><span>Open</span></div>
      <div class="stat"><b id="sDone">0</b><span>Done</span></div>
      <div class="stat"><b id="sLate">0</b><span>Overdue</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="card add">
      <input class="title" id="text" placeholder="What needs doing?" maxlength="140" autocomplete="off">
      <div class="opts">
        <select id="pri" aria-label="Priority"><option value="high">High priority</option><option value="med" selected>Medium priority</option><option value="low">Low priority</option></select>
        <select id="cat" aria-label="Category"><option>Work</option><option>Personal</option><option>Health</option><option>Learning</option></select>
        <input type="date" id="due" aria-label="Due date">
      </div>
      <button class="go" id="addBtn">Add task</button>
    </div>
    <div class="bar-row" id="filters">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="open" aria-pressed="false">Open</button>
      <button class="chip" data-f="done" aria-pressed="false">Done</button>
      <span class="spacer"></span>
      <button class="chip" id="clear">Clear completed</button>
    </div>
    <ul class="list" id="list"></ul>
  </main>
</div>
<script>
(function(){
  var KEY="taskline:v1", tasks=[], filter="all";
  var $=function(i){return document.getElementById(i)};
  function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function iso(d){return d.toISOString().slice(0,10)}
  function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
  tasks=load()||[
    {id:1,text:"Plan next week's priorities",pri:"high",cat:"Work",due:plus(0),done:false},
    {id:2,text:"30-minute walk",pri:"low",cat:"Health",due:plus(1),done:true},
    {id:3,text:"Finish chapter 4 notes",pri:"med",cat:"Learning",due:plus(3),done:false},
    {id:4,text:"Book dentist appointment",pri:"med",cat:"Personal",due:plus(-1),done:false}];
  function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fmt(d){var p=d.split("-");return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
  function render(){
    var today=iso(new Date()), total=tasks.length, done=tasks.filter(function(t){return t.done}).length;
    var late=tasks.filter(function(t){return !t.done&&t.due&&t.due<today}).length;
    var pct=total?Math.round(done/total*100):0;
    $("pct").textContent=pct+"%";
    $("bar").style.strokeDashoffset=540.35*(1-pct/100);
    $("sOpen").textContent=total-done;$("sDone").textContent=done;$("sLate").textContent=late;
    $("sub").textContent=total?done+" of "+total+" done":"no tasks yet";
    $("msg").textContent=!total?"Add your first task to get started.":pct===100?"All clear. Nice work.":late?late+" overdue — start there.":(total-done)+" to go today.";
    var shown=tasks.filter(function(t){return filter==="all"||(filter==="done"?t.done:!t.done)});
    var order={high:0,med:1,low:2};
    shown.sort(function(a,b){return a.done-b.done||order[a.pri]-order[b.pri]||(a.due||"9").localeCompare(b.due||"9")});
    $("list").innerHTML=shown.length?shown.map(function(t){
      var isLate=!t.done&&t.due&&t.due<today;
      return '<li class="task'+(t.done?' done':'')+'" data-p="'+t.pri+'" data-id="'+t.id+'">'+
        '<button class="check" data-a="toggle" aria-label="Mark '+(t.done?'open':'done')+'">'+(t.done?'✓':'')+'</button>'+
        '<div class="body"><div class="t">'+esc(t.text)+'</div><div class="meta"><span class="pill">'+esc(t.cat)+'</span>'+
        (t.due?'<span class="'+(isLate?'late':'')+'">'+(isLate?'Overdue · ':'Due ')+fmt(t.due)+'</span>':'')+'</div></div>'+
        '<button class="del" data-a="del" aria-label="Delete task">×</button></li>'}).join("")
      :'<li class="empty">'+(total?'Nothing in this view.':'No tasks yet. Add one above.')+'</li>';
    save();
  }
  function add(){
    var v=$("text").value.trim();if(!v){$("text").focus();return}
    tasks.push({id:Date.now(),text:v,pri:$("pri").value,cat:$("cat").value,due:$("due").value,done:false});
    $("text").value="";$("due").value="";render();$("text").focus();
  }
  $("addBtn").onclick=add;
  $("text").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  $("list").addEventListener("click",function(e){
    var b=e.target.closest("button[data-a]");if(!b)return;
    var id=+b.closest(".task").dataset.id;
    if(b.dataset.a==="toggle")tasks.forEach(function(t){if(t.id===id)t.done=!t.done});
    else tasks=tasks.filter(function(t){return t.id!==id});
    render();
  });
  $("filters").addEventListener("click",function(e){
    var b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(function(c){c.setAttribute("aria-pressed",c===b)});render();
  });
  $("clear").onclick=function(){tasks=tasks.filter(function(t){return !t.done});render()};
  $("theme").onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };
  render();
})();
</script>
</body>
</html>
